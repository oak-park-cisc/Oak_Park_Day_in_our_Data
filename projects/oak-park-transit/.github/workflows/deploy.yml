name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *' # refresh CTA alerts (GitHub may run this late)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Falls back to the committed alerts.json if the CTA feed is down
      - run: python3 scripts/fetch_alerts.py || echo "alerts fetch failed, using committed copy"
      - run: npm ci
      - run: npm run build
        env:
          # Set in repo Settings > Variables after deploying worker/ to Cloudflare
          VITE_BUS_PROXY_URL: ${{ vars.BUS_PROXY_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
